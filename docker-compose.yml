version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon0-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./app/hackathon.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - AI_PROVIDER=${AI_PROVIDER:-claude}
      - AI_CLI_TIMEOUT=30
      - LOG_LEVEL=INFO
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - backend_data:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hackathon0-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon0-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hackathon0-network

# Volumes
volumes:
  backend_data:
    driver: local

# Networks
networks:
  hackathon0-network:
    driver: bridge
